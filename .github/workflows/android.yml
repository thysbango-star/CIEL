name: Build & test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests (pure Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :testing:run --stacktrace

  android:
    name: Android debug APK + lint
    runs-on: ubuntu-latest
    needs: core-tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ciel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish debug APK as a direct download (release "debug-latest")
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ciel-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest ciel-debug.apk --prerelease \
            --target "${{ github.sha }}" --title "Ciel debug build (latest main)" \
            --notes "Automatically built from ${{ github.sha }}. Debug build for testing — install over the previous one."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  windows:
    name: Windows desktop app (real-Windows smoke test + installer)
    runs-on: windows-latest
    needs: core-tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests on Windows
        run: ./gradlew :testing:run --stacktrace
      - name: Windows smoke test (real drives, processes, power plans, typeperf, health, downloads)
        if: always()
        run: ./gradlew :testing:windowsSmoke --stacktrace
      - name: Build the desktop app and installer
        if: always()
        run: ./gradlew :desktop:createDistributable :desktop:packageMsi --stacktrace
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path desktop/build/compose/binaries/main/app/Ciel -DestinationPath out/ciel-windows-portable.zip
          Copy-Item (Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName out/ciel-windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: ciel-windows
          path: out/*
      - name: Publish as a direct download (release "desktop-latest")
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest out/ciel-windows.msi out/ciel-windows-portable.zip --prerelease \
            --target "${{ github.sha }}" --title "Ciel for Windows (latest main)" \
            --notes "Automatically built from ${{ github.sha }}. Install with ciel-windows.msi (per-user, no admin needed), or unzip ciel-windows-portable.zip and run Ciel.exe. Unsigned test build: Windows SmartScreen may ask you to confirm (More info → Run anyway)."

  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore (from repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.CIEL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets configured; skipping release." && exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ciel.jks"
          echo "CIEL_KEYSTORE_PATH=$RUNNER_TEMP/ciel.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        if: env.CIEL_KEYSTORE_PATH != ''
        env:
          CIEL_KEYSTORE_PASSWORD: ${{ secrets.CIEL_KEYSTORE_PASSWORD }}
          CIEL_KEY_ALIAS: ${{ secrets.CIEL_KEY_ALIAS }}
          CIEL_KEY_PASSWORD: ${{ secrets.CIEL_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: env.CIEL_KEYSTORE_PATH != ''
        with:
          name: ciel-release-apk
          path: app/build/outputs/apk/release/*.apk
